<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자기소개</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts (Inter & Noto Sans KR) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-50 to-slate-100 text-slate-800 min-h-screen flex items-center justify-center p-6">

    <!-- 프로필 카드 (화면 중앙 정렬) -->
    <main class="w-full max-w-md bg-white rounded-3xl shadow-xl border border-slate-100 p-8 text-center transition-all duration-300 hover:shadow-2xl">
        
        <!-- 1. 프로필 사진 -->
        <div class="relative inline-block mb-6">
            <img 
                src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&w=400&auto=format&fit=crop" 
                alt="프로필 사진" 
                class="w-32 h-32 sm:w-36 sm:h-36 rounded-full object-cover mx-auto ring-4 ring-indigo-50 shadow-md"
                onerror="this.onerror=null; this.src='https://placehold.co/150x150/e2e8f0/475569?text=Profile';"
            />
        </div>

        <!-- 2. 이름 -->
        <h1 class="text-2xl sm:text-3xl font-bold text-slate-900 tracking-tight mb-2">
            Happy Jay
        </h1>

        <!-- 3. 한 줄 소개 -->
        <p class="text-indigo-600 font-medium text-sm sm:text-base mb-6">
            행복하게, 긍정적으로 생각하고 살려는 신중년
        </p>

        <hr class="border-slate-100 mb-6 w-1/2 mx-auto">

        <!-- 4. 3~4줄 자기소개 -->
        <p class="text-slate-600 text-sm sm:text-base leading-relaxed text-balance">
            몇년전 오랜 공직생활을 정리하고 현재는 즐겁게 은퇴생활을 보내려고 노력중입니다. 그러한 노력의 일환으로 여행과 사진을 즐기고 AI도 익히고 있습니다.
        </p>

    </main>

</body>
</html>
